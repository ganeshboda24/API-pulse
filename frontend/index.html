<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0b1220" />
    <meta name="description" content="A clear dashboard for checking website health and reviewing recent HTTP results." />
    <meta property="og:title" content="API Pulse" />
    <meta property="og:description" content="Check website health and inspect recent HTTP results." />
    <meta property="og:type" content="website" />
    <title>API Pulse — Website health dashboard</title>
    <script>
      (() => {
        const savedTheme = localStorage.getItem("api-pulse-theme") || "system";
        const theme =
          savedTheme === "system"
            ? matchMedia("(prefers-color-scheme: dark)").matches
              ? "dark"
              : "light"
            : savedTheme;
        document.documentElement.dataset.theme = theme;
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
